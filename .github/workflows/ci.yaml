name: ci

on:
  push:
    branches:
      - '**'
jobs:
  get_version:
    uses: ./.github/workflows/get-version.yaml
    secrets: inherit
  build_and_push:
    uses: ./.github/workflows/build.yaml
    secrets: inherit
    needs: get_version    
    with:
      newVersion: ${{ needs.get_version.outputs.newVersion }}
      version: ${{ needs.get_version.outputs.version }}
      hash: ${{ needs.get_version.outputs.hash }}
      tag: ${{ needs.get_version.outputs.tag }}
      channel: ${{ needs.get_version.outputs.channel }}
  # Generates pepperdash-metadata.json for each new release and registers it with Portal
  metadata:
    needs: [get_version, build_and_push]
    if: needs.get_version.outputs.newVersion == 'true'
    uses: PepperDash/workflow-templates/.github/workflows/pepperdash-metadata.yml@main
    permissions:
      contents: write   # attach pepperdash-metadata.json to the release
      id-token: write   # GitHub OIDC token for UDM
    with:
      tag: ${{ needs.get_version.outputs.tag }}
      kind: userInterface
