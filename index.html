<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Essentials Demo</title>
    <script>
      // Mobile Control serves this app under a session-scoped path such as
      // /mc/app/<token>/<roomKey>/. React Router needs that prefix as its basename, so derive it
      // from the current URL and write a <base> tag before the bundle loads. main.tsx repeats this
      // calculation for the router itself.
      const basePath = location.pathname.split('/').filter((segment) => segment.length > 0);

      // A full session URL has 5 leading segments; a bare /mc/app/ load has 2.
      basePath.length = basePath.length >= 5 ? 5 : 2;

      document.write(`<base href="/${basePath.join('/')}/"/>`);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
